            // 选区范围 [start, end)，无选区返回 null
            function getSelectionRange() {
                if (selectionAnchor === null) return null;
                const start = Math.min(selectionAnchor, cursorPosition);
                const end = Math.max(selectionAnchor, cursorPosition);
                return start === end ? null : [start, end];
            }

            // 是否允许开始/扩展选区（英文或中文 buffer 为空）

            // 显示屏幕中心绿底白字提示，durationMs 毫秒后消失
            function showToast(msg, durationMs) {
                if (findMessageTimeout) clearTimeout(findMessageTimeout);
                findMessage = msg;
                findMessageTimeout = setTimeout(function() {
                    findMessage = null;
                    findMessageTimeout = null;
                    render();
                }, durationMs);
                render();
            }

            function showFindMessage(msg) {
                showToast(msg, 1000);

                        const slice = textBuffer.slice(i, i + needleLen).map(function(item) { return item.char; }).join('');
                        if (slice === needle) return i;
                    }
                    return -1;
                }
                for (let i = Math.min(startPos, textBuffer.length - needleLen); i >= 0; i--) {
                    const slice = textBuffer.slice(i, i + needleLen).map(function(item) { return item.char; }).join('');
                    if (slice === needle) return i;
                }
                return -1;
            }

            // 全文统计 needle 出现次数。greedy true=重叠匹配（每次前进1），false=非重叠（每次前进 needle 长度）
            function countInBuffer(needle, greedy) {
                const needleLen = [...needle].length;
                if (needleLen === 0) return 0;
                let count = 0;
                let pos = 0;
                const step = greedy ? 1 : needleLen;
                while (pos <= textBuffer.length - needleLen) {
                    const slice = textBuffer.slice(pos, pos + needleLen).map(function(item) { return item.char; }).join('');
                    if (slice === needle) {
                        count++;
                        pos += step;
                    } else {
                        pos += 1;
                    }
                }
                return count;
            }

            // 计数剪贴板内容（全文）：greedy 为 true 时贪婪匹配。找不到或剪贴板为空时提示，找到则弹出数字 1 秒
            function doCount(greedy) {
                if (appClipboard.length === 0) {
                    showFindMessage('剪贴板为空');
                    return;
                }
                const needle = appClipboard;
                const count = countInBuffer(needle, greedy);
                if (count === 0) {
                    showFindMessage('找不到文本');
                    return;
                }
                showToast(String(count), 1000);
            }

            // 从应用内剪贴板读取 needle，执行查找。forward true=向右，false=向左
            function doFind(forward) {
                if (appClipboard.length === 0) {
                    showFindMessage('剪贴板为空');
                    return;
                }
                const needle = appClipboard;
                const needleLen = [...needle].length;
                let startPos;
                const range = getSelectionRange();
                if (range === null) {
                    startPos = cursorPosition;
                } else {
                    startPos = forward ? Math.max(selectionAnchor, cursorPosition) : Math.min(selectionAnchor, cursorPosition);
                }
                let idx;
                if (forward) {
                    idx = findInBuffer(needle, startPos, true);
                } else {
                    if (startPos < needleLen) {
                        idx = -1;
                    } else {
                        idx = findInBuffer(needle, startPos - needleLen, false);
                    }
                }
                if (idx === -1) {
                    showFindMessage('找不到文本');
                    return;
                }
                if (forward) {
                    selectionAnchor = idx;
                    cursorPosition = idx + needleLen;
                } else {
                    selectionAnchor = idx + needleLen;
                    cursorPosition = idx;
                }
                ensureCursorVisible();
                cursorVisible = true;
                render();
            }

            // 贪婪查找：向右从选区左端右边一个字符处开始，向左从选区右端左边一个字符处开始；无选区时与 doFind 相同
            function doFindGreedy(forward) {
                if (appClipboard.length === 0) {
                    showFindMessage('剪贴板为空');
                    return;
                }
                const needle = appClipboard;
                const needleLen = [...needle].length;
                let startPos;
                const range = getSelectionRange();
                if (range !== null) {
                    if (forward) {
                        startPos = range[0] + 1;
                    } else {
                        if (range[1] - 1 < needleLen) {
                            showFindMessage('找不到文本');
                            return;
                        }
                        startPos = range[1] - 1;
                    }
                } else {
                    startPos = cursorPosition;
                }
                let idx;
                if (forward) {
                    idx = startPos <= textBuffer.length - needleLen ? findInBuffer(needle, startPos, true) : -1;
                } else {
                    if (startPos < needleLen) {
                        idx = -1;
                    } else {
                        idx = findInBuffer(needle, startPos - needleLen, false);
                    }
                }
                if (idx === -1) {
                    showFindMessage('找不到文本');
                    return;
                }
                if (forward) {
                    selectionAnchor = idx;
                    cursorPosition = idx + needleLen;
                } else {
                    selectionAnchor = idx + needleLen;
                    cursorPosition = idx;
                }
                ensureCursorVisible();
                cursorVisible = true;
                render();
            }

            // 插入字符或字符串，若有选区则先替换选区；覆盖模式下无选区时覆盖光标后字符（非换行）。插入后光标在内容后并确保可见。
            function insertTextReplacingSelection(text) {
                const range = getSelectionRange();
                if (range) {
                    const [start, end] = range;
                    const before = textBuffer.slice(0, start);
                    const after = textBuffer.slice(end);
                    let newCursor = start;
                    for (const ch of text) {
                        const w = ch === '\n' ? 0 : getCharWidth(ch);
                        before.push({ char: ch, widthPx: w });
                        newCursor++;
                    }
                    textBuffer = before.concat(after);
                    cursorPosition = newCursor;
                    selectionAnchor = null;
                } else if (overwriteMode) {
                    for (const ch of text) {
                        const w = ch === '\n' ? 0 : getCharWidth(ch);
                        if (cursorPosition < textBuffer.length && textBuffer[cursorPosition].char !== '\n') {
                            textBuffer[cursorPosition] = { char: ch, widthPx: w };
                            cursorPosition++;
                        } else {
                            textBuffer.splice(cursorPosition, 0, { char: ch, widthPx: w });
                            cursorPosition++;
                        }
                    }
                } else {
                    for (const ch of text) {
                        const w = ch === '\n' ? 0 : getCharWidth(ch);
                        textBuffer.splice(cursorPosition, 0, { char: ch, widthPx: w });
                        cursorPosition++;
                    }
                }
                rebuildLayout();
                ensureCursorVisible();
                cursorVisible = true;
                render();
            }

            // 获取拼音对应的候选字
            function getPinyinCandidates(pinyin) {
                if (!pinyin || pinyin.length === 0) return [];
                return pinyinMap[pinyin] || [];
            }

            // 更新候选字列表
            function updateImeCandidates() {
                imeCandidates = getPinyinCandidates(imeBuffer);
                imeSelectedIndex = 0;
                imePage = 0;
            }

            // 提交选中的候选字（会替换选区）
            function commitImeChar(index) {
                if (imeCandidates.length === 0) return;
                const actualIndex = imePage * IME_MAX_CANDIDATES + index;
                if (actualIndex < imeCandidates.length) {
                    const selectedChar = imeCandidates[actualIndex];
                    insertTextReplacingSelection(selectedChar);
                    imeBuffer = "";
                    imeCandidates = [];
                    imeSelectedIndex = 0;
                    imePage = 0;
                }
            }

            // 处理拼音输入
function handleImeInput(key) {
    // 中文标点映射表
    const chinesePunctuation = {
        ',': '，',
        '.': '。',
        '?': '？',
        '!': '！',
        ':': '：',
        ';': '；',
        '"': '“”',
        "'": '‘’',
        '<': '《',
        '>': '》',
        '(': '（',
        ')': '）',
        '[': '【',
        ']': '】',
        '\\': '、',
        '/': '／',
        '~': '～',
        '@': '＠',
        '#': '＃',
        '$': '￥',
        '%': '％',
        '^': '……',
        '&': '＆',
        '*': '×',
        '-': '-',
        '_': '——',
        '+': '＋',
        '=': '＝',
        '`': '·'
    };
    
    // 处理中文标点（当没有拼音缓冲区时）
    if (imeBuffer.length === 0 && chinesePunctuation[key]) {
        const chineseChar = chinesePunctuation[key];
        if (chineseChar.length === 2) {
            insertTextReplacingSelection(chineseChar[0] + chineseChar[1]);
        } else {
            insertTextReplacingSelection(chineseChar);
        }
        return;
    }
    
    // 处理数字和空格（当没有拼音缓冲区时）
    if (imeBuffer.length === 0) {
        if (key >= '0' && key <= '9') {
            insertTextReplacingSelection(key);
            return;
        }
        if (key === ' ') {
            insertTextReplacingSelection(' ');
            return;
        }
    }
    
    // 原有的拼音输入逻辑
    if (key.length === 1 && /[a-z]/.test(key)) {
        // 添加拼音字母（最多 6 个）
        if (imeBuffer.length < 6) {
            imeBuffer += key;
            updateImeCandidates();
        }
    
    } else if (key >= '1' && key <= '5') {
        // 数字键选择候选字
        const index = parseInt(key) - 1;
        if (index < imeCandidates.length - imePage * IME_MAX_CANDIDATES) {
            commitImeChar(index);
        }
    } else if (key === 'Backspace') {
        if (imeBuffer.length > 0) {
            // 删除拼音字母
            imeBuffer = imeBuffer.slice(0, -1);
            updateImeCandidates();
        } else {
            // 拼音为空时，删除普通字符
            if (cursorPosition > 0) {
                // 普通删除
                textBuffer.splice(cursorPosition - 1, 1);
                cursorPosition--;
                
                rebuildLayout();
                ensureCursorVisible();
            }
        }
    } else if (key === 'Enter') {
        if (imeBuffer.length > 0) {
            insertTextReplacingSelection(imeBuffer);
            imeBuffer = "";
            imeCandidates = [];
        } else {
            insertTextReplacingSelection('\n');
        }
    } else if (key === 'ArrowLeft' || key === 'ArrowRight') {
        // 拼音模式下左右键移动光标
        if (key === 'ArrowLeft' && cursorPosition > 0) {
            cursorPosition--;
        } else if (key === 'ArrowRight' && cursorPosition < textBuffer.length) {
            cursorPosition++;
        }
        // 移动光标时清空拼音
        imeBuffer = "";
        imeCandidates = [];
        ensureCursorVisible();
    } else if (key === '-' && imePage > 0) {
        imePage--;
    } else if (key === '=' && (imePage + 1) * IME_MAX_CANDIDATES < imeCandidates.length) {
        imePage++;
    } else if (key.length === 1 && !/^[a-z0-9\s]$/.test(key) && !chinesePunctuation[key]) {
        insertTextReplacingSelection(key);
    }
    
    cursorVisible = true;
    render();
}

            // 插入字符到buffer并更新布局（有选区时先替换选区再插入）
            function insertChar(char) {
                if (!fontLoaded) return;
                if (isChineseMode) {
                    handleImeInput(char);
                    return;
                }

                // 英文模式
                if (char === 'Enter') {
                    insertTextReplacingSelection('\n');
                    return;
                }
                if (char === 'Backspace') {
                    if (cursorPosition > 0) {
                        textBuffer.splice(cursorPosition - 1, 1);
                        cursorPosition--;
                    }
                    rebuildLayout();
                    ensureCursorVisible();
                    render();
                    return;
                }
                if (char.length === 1 && char >= ' ') {
                    insertTextReplacingSelection(char);
                }
            }

            // 工具函数
            function measureFontMetrics() {
                if (!fontLoaded) return;

                try {
                    const testChars = 'Aa1';
                    const [totalWidth, totalHeight] = window.getScrText(testChars, SCALE);
                    
                    CHAR_WIDTH_AVG = Math.ceil(totalWidth / testChars.length);
                    
                    const [_, h] = window.getScrText('A', SCALE);
                    CHAR_HEIGHT_SCALED = h;
                    CHAR_HEIGHT = Math.ceil(h / SCALE);
                    
                    LINE_SPACING = Math.max(1, Math.ceil(CHAR_HEIGHT_SCALED * 0.1));
                    LINE_HEIGHT = CHAR_HEIGHT_SCALED + LINE_SPACING;
                    
                    console.log(`字体测量结果: 字符高度=${CHAR_HEIGHT}px (放大后=${CHAR_HEIGHT_SCALED}px), 平均宽度=${CHAR_WIDTH_AVG}px, 行高=${LINE_HEIGHT}px`);
                } catch (e) {
                    console.warn('字体测量失败，使用默认值', e);
                    CHAR_HEIGHT = 16;
                    CHAR_HEIGHT_SCALED = CHAR_HEIGHT * SCALE;
                    LINE_SPACING = Math.max(1, Math.ceil(CHAR_HEIGHT_SCALED * 0.1));
                    LINE_HEIGHT = CHAR_HEIGHT_SCALED + LINE_SPACING;
                }
            }

            function getCharWidth(char) {
                if (!fontLoaded) return CHAR_WIDTH_AVG * SCALE;
                if (char === '\n') return 0;
                
                try {
                    const [w] = window.getScrText(char, SCALE);
                    return Math.max(1, w);
                } catch (e) {
                    return CHAR_WIDTH_AVG * SCALE;
                }
            }

            function rebuildLayout() {
                if (!fontLoaded) {
                    lines = [];
                    updateMaxScroll();
                    return;
                }

                const newLines = [];
                let currentLineStart = 0;
                let currentX = 0;
                let currentY = 0;
                let currentXPositions = [];

                for (let i = 0; i <= textBuffer.length; i++) {
                    if (i === textBuffer.length) {
                        if (currentLineStart <= i) {
                            newLines.push({
                                startIndex: currentLineStart,
                                endIndex: i,
                                yStart: currentY,
                                yEnd: currentY + CHAR_HEIGHT_SCALED - 1,
                                xPositions: currentXPositions.slice()
                            });
                        }
                        break;
                    }

                    const item = textBuffer[i];

                    if (item.char === '\n') {
                        newLines.push({
                            startIndex: currentLineStart,
                            endIndex: i,
                            yStart: currentY,
                            yEnd: currentY + CHAR_HEIGHT_SCALED - 1,
                            xPositions: currentXPositions.slice()
                        });
                        
                        currentLineStart = i + 1;
                        currentX = 0;
                        currentY += LINE_HEIGHT;
                        currentXPositions = [];
                        continue;
                    }

                    const charW = item.widthPx;
                    currentXPositions.push(currentX);

                    if (currentX + charW > TEXT_AREA_WIDTH && currentX > 0) {
                        currentXPositions.pop();
                        
                        newLines.push({
                            startIndex: currentLineStart,
                            endIndex: i,
                            yStart: currentY,
                            yEnd: currentY + CHAR_HEIGHT_SCALED - 1,
                            xPositions: currentXPositions.slice()
                        });
                        
                        currentLineStart = i;
                        currentX = charW;
                        currentY += LINE_HEIGHT;
                        currentXPositions = [0];
                    } else {
                        currentX += charW;
                    }
                }

                lines = newLines;
                updateMaxScroll();
            }

            function updateMaxScroll() {
                const totalLines = lines.length;
                const visibleLines = Math.floor(TEXT_AREA_HEIGHT / LINE_HEIGHT);
                const max = Math.max(0, totalLines - visibleLines);
                maxScrollLines = max;
                if (scrollOffset > maxScrollLines) {
                    scrollOffset = maxScrollLines;
                }
                if (scrollOffset < 0) scrollOffset = 0;
            }

            // 返回当前光标在“视行”下的行号(1-based)与列号(1-based，该视行首字符前为1)
            function getCursorVisualLineAndCol() {
                if (lines.length === 0) return { visualLine1: 1, visualCol1: 1 };
                const loc = getCursorLocation();
                const lineIdx = loc.lineIndex;
                const line = lines[lineIdx];
                if (!line) return { visualLine1: 1, visualCol1: 1 };
                const col1 = loc.charIndex + 1;
                return { visualLine1: lineIdx + 1, visualCol1: col1 };
            }

            function getCursorLocation() {
                if (lines.length === 0) {
                    return { lineIndex: 0, charIndex: 0, x: 0, y: 0, rawY: 0 };
                }

                if (cursorPosition === textBuffer.length) {
                    const lastLine = lines[lines.length - 1];
                    if (lastLine) {
                        let x = 0;
                        for (let i = lastLine.startIndex; i < lastLine.endIndex; i++) {
                            if (textBuffer[i] && textBuffer[i].char !== '\n') {
                                x += textBuffer[i].widthPx;
                            }
                        }
                        return {
                            lineIndex: lines.length - 1,
                            charIndex: lastLine.endIndex - lastLine.startIndex,
                            x: Math.min(x, TEXT_AREA_WIDTH - 1),
                            y: (lines.length - 1 - scrollOffset) * LINE_HEIGHT,
                            rawY: (lines.length - 1) * LINE_HEIGHT
                        };
                    }
                }

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    if (cursorPosition >= line.startIndex && cursorPosition <= line.endIndex) {
                        // 仅当是“因过长溢出”到下一行时，把行尾光标显示在下一行开头；若下一字符是换行符则仍显示在第一行行尾
                        const hasNextLine = i + 1 < lines.length;
                        const nextCharIsNewline = textBuffer[line.endIndex] && textBuffer[line.endIndex].char === '\n';
                        if (cursorPosition === line.endIndex && hasNextLine && !nextCharIsNewline) {
                            return {
                                lineIndex: i + 1,
                                charIndex: 0,
                                x: 0,
                                y: (i + 1 - scrollOffset) * LINE_HEIGHT,
                                rawY: (i + 1) * LINE_HEIGHT
                            };
                        }
                        const charIndex = cursorPosition - line.startIndex;
                        let x = 0;
                        if (charIndex > 0) {
                            for (let j = line.startIndex; j < cursorPosition; j++) {

                            lineIndex: i,
                            charIndex: charIndex,

                return { lineIndex: 0, charIndex: 0, x: 0, y: 0, rawY: 0 };
            }

            function ensureCursorVisible() {

                const cursorLoc = getCursorLocation();
                const visibleLines = Math.floor(TEXT_AREA_HEIGHT / LINE_HEIGHT);
                
                if (cursorLoc.lineIndex < scrollOffset) {
                    scrollOffset = cursorLoc.lineIndex;
                } else if (cursorLoc.lineIndex >= scrollOffset + visibleLines) {
                    scrollOffset = cursorLoc.lineIndex - visibleLines + 1;
                }
                scrollOffset = Math.max(0, Math.min(scrollOffset, maxScrollLines));
                
            }

            function moveCursorUp() {
                if (lines.length === 0) return;

                const currentLoc = getCursorLocation();
                if (currentLoc.lineIndex <= 0) return;

                lastCursorX = currentLoc.x;
                const targetLine = lines[currentLoc.lineIndex - 1];

                let minDiff = Math.abs(0 - lastCursorX);

            function moveCursorToLineStart() {

                        lineStart = i + 1;

                    imeCandidates = [];

            function moveCursorPageUp() {
                if (lines.length === 0) return;
                const visibleLines = Math.max(1, Math.floor(TEXT_AREA_HEIGHT / LINE_HEIGHT));

                const targetLineIndex = Math.max(0, currentLoc.lineIndex - visibleLines);
                const targetLine = lines[targetLineIndex];
                if (!targetLine) return;

                for (let i = targetLine.startIndex; i <= targetLine.endIndex; i++) {
                    let charLeftX = 0;
                    for (let j = targetLine.startIndex; j < i; j++) {
                        if (textBuffer[j] && textBuffer[j].char !== '\n') charLeftX += textBuffer[j].widthPx;
                    }
                    const leftDiff = Math.abs(charLeftX - lastCursorX);
                    if (leftDiff < minDiff) {

                    } else {
                        const cw = (textBuffer[i] && textBuffer[i].char !== '\n') ? textBuffer[i].widthPx : 0;
                        const rightDiff = Math.abs(charLeftX + cw - lastCursorX);
                        if (rightDiff < minDiff) {
                            minDiff = rightDiff;
                            bestCharIndex = i - targetLine.startIndex + 1;
                        }
                    }
                }
                cursorPosition = targetLine.startIndex + bestCharIndex;
                lastCursorX = (bestCharIndex <= 0) ? 0 : (function() {
                    let x = 0;
                    for (let j = targetLine.startIndex; j < targetLine.startIndex + bestCharIndex; j++) {
                        if (textBuffer[j] && textBuffer[j].char !== '\n') x += textBuffer[j].widthPx;
                    }
                    return x;
                })();
                if (isChineseMode) { imeBuffer = ''; imeCandidates = []; }
                ensureCursorVisible();
                cursorVisible = true;
                render();
            }

            function moveCursorPageDown() {
                if (lines.length === 0) return;
                const visibleLines = Math.max(1, Math.floor(TEXT_AREA_HEIGHT / LINE_HEIGHT));
                const currentLoc = getCursorLocation();
                const targetLineIndex = Math.min(lines.length - 1, currentLoc.lineIndex + visibleLines);
                const targetLine = lines[targetLineIndex];
                if (!targetLine) return;
                lastCursorX = currentLoc.x;
                let bestCharIndex = 0;
                let bestX = 0;
                let minDiff = Math.abs(0 - lastCursorX);
                for (let i = targetLine.startIndex; i <= targetLine.endIndex; i++) {
                    let charLeftX = 0;
                    for (let j = targetLine.startIndex; j < i; j++) {
                        if (textBuffer[j] && textBuffer[j].char !== '\n') charLeftX += textBuffer[j].widthPx;
                    }
                    const leftDiff = Math.abs(charLeftX - lastCursorX);
                    if (leftDiff < minDiff) {
                        minDiff = leftDiff;
                        bestCharIndex = i - targetLine.startIndex;
                        bestX = charLeftX;
                    }
                    if (i === targetLine.endIndex) {
                        if (Math.abs(charLeftX - lastCursorX) < minDiff) {
                            bestCharIndex = i - targetLine.startIndex;
                        }
                    } else {
                        const cw = (textBuffer[i] && textBuffer[i].char !== '\n') ? textBuffer[i].widthPx : 0;
                        const rightDiff = Math.abs(charLeftX + cw - lastCursorX);
                        if (rightDiff < minDiff) {
                            minDiff = rightDiff;
                            bestCharIndex = i - targetLine.startIndex + 1;
                        }
                    }
                }
                cursorPosition = targetLine.startIndex + bestCharIndex;
                lastCursorX = (bestCharIndex <= 0) ? 0 : (function() {
                    let x = 0;
                    for (let j = targetLine.startIndex; j < targetLine.startIndex + bestCharIndex; j++) {
                        if (textBuffer[j] && textBuffer[j].char !== '\n') x += textBuffer[j].widthPx;
                    }
                    return x;
                })();
                if (isChineseMode) { imeBuffer = ''; imeCandidates = []; }
                ensureCursorVisible();
                cursorVisible = true;
                render();
            }

            function render() {
                if (!screenCreated || !fontLoaded) return;

                // 绘制文本区域 (白色背景)
                window.setScr2(0, 0, SCREEN_WIDTH-1, TEXT_AREA_HEIGHT-1, 255, 255, 255);

                // 绘制右侧进度条区域
                window.setScr2(SCREEN_WIDTH - SCROLL_BAR_WIDTH, 0, SCREEN_WIDTH-1, TEXT_AREA_HEIGHT-1, 240, 240, 240);

                // 绘制滚动条滑块
                if (maxScrollLines > 0) {
                    const barHeight = TEXT_AREA_HEIGHT;
                    const thumbHeight = Math.max(6, Math.floor(barHeight * (TEXT_AREA_HEIGHT / (lines.length * LINE_HEIGHT))));
                    const thumbY = Math.floor((scrollOffset / maxScrollLines) * (barHeight - thumbHeight));
                    window.setScr2(
                        SCREEN_WIDTH - SCROLL_BAR_WIDTH, thumbY,
                        SCREEN_WIDTH-1, thumbY + thumbHeight - 1,
                        100, 100, 100
                    );
                }

                // 绘制文本行（选区天蓝底白字）
                const selRange = getSelectionRange();
                const visibleStartY = 0;
                const visibleEndY = TEXT_AREA_HEIGHT - 1;
                
                for (let lineIdx = 0; lineIdx < lines.length; lineIdx++) {
                    const line = lines[lineIdx];
                    if (!line) continue;

                    const screenYBase = (lineIdx - scrollOffset) * LINE_HEIGHT;
                    const lineTop = screenYBase;
                    const lineBottom = screenYBase + LINE_HEIGHT - 1;
                    
                    if (lineTop >= 0 && lineBottom < TEXT_AREA_HEIGHT) {
                        for (let i = line.startIndex; i < line.endIndex; i++) {
                            const item = textBuffer[i];
                            if (!item || item.char === '\n') continue;

                            const charIdx = i - line.startIndex;
                            let xPos = 0;
                            if (charIdx < line.xPositions.length) {
                                xPos = line.xPositions[charIdx];
                            } else {
                                xPos = 0;
                                for (let j = line.startIndex; j < i; j++) {
                                    xPos += textBuffer[j].widthPx;
                                }
                            }

                            if (xPos < TEXT_AREA_WIDTH && xPos + item.widthPx > 0) {
                                const drawX1 = Math.max(0, xPos);
                                const drawY1 = Math.max(0, screenYBase);
                                const drawX2 = Math.min(TEXT_AREA_WIDTH - 1, xPos + item.widthPx - 1);
                                const drawY2 = Math.min(TEXT_AREA_HEIGHT - 1, screenYBase + CHAR_HEIGHT_SCALED - 1);
                                
                                if (drawX1 <= drawX2 && drawY1 <= drawY2) {
                                    const inSel = selRange && i >= selRange[0] && i < selRange[1];
                                    const rText = inSel ? 255 : 0;
                                    const gText = inSel ? 255 : 0;
                                    const bText = inSel ? 255 : 0;
                                    const rBg = inSel ? 135 : 255;
                                    const gBg = inSel ? 206 : 255;
                                    const bBg = inSel ? 235 : 255;
                                    window.setScrText(
                                        item.char,
                                        drawX1, drawY1,
                                        SCALE,
                                        rText, gText, bText,
                                        rBg, gBg, bBg
                                    );
                                }
                            }
                        }
                    }
                }

                // 绘制光标（覆盖模式为绿色，否则红色）
                if (cursorVisible) {
                    const cursorLoc = getCursorLocation();
                    const screenY = cursorLoc.rawY - scrollOffset * LINE_HEIGHT;
                    const cursorR = overwriteMode ? 0 : 255;
                    const cursorG = overwriteMode ? 255 : 0;
                    const cursorB = 0;
                    if (screenY >= 0 && screenY + CHAR_HEIGHT_SCALED < TEXT_AREA_HEIGHT && cursorLoc.x < TEXT_AREA_WIDTH) {
                        const cursorX = Math.min(cursorLoc.x, TEXT_AREA_WIDTH - 2);
                        const cursorY1 = Math.max(0, screenY);
                        const cursorY2 = Math.min(TEXT_AREA_HEIGHT - 1, screenY + CHAR_HEIGHT_SCALED - 1);
                        
                        if (cursorY1 <= cursorY2) {
                            window.setScr2(cursorX, cursorY1, cursorX + 1, cursorY2, cursorR, cursorG, cursorB);
                        }
                    }
                }

                // 绘制输入法区域 (底部)
                const imeY = TEXT_AREA_HEIGHT;
                
                // 输入法区域背景
                window.setScr2(0, imeY, SCREEN_WIDTH-1, SCREEN_HEIGHT-1, 240, 240, 240);
                window.setScr2(0, imeY+25, SCREEN_WIDTH-1, imeY+25, 0, 0, 0);
                // 输入法模式指示
                const modeText = isChineseMode ? "中文" : "英文";
                const [modeW, modeH] = window.getScrText(modeText, 1);
                window.setScrText(
                    modeText, 
                    2, imeY + (IME_AREA_HEIGHT - modeH) / 2, 
                    1, 
                    isChineseMode ? 0 : 100, 
                    isChineseMode ? 100 : 0, 
                    0, 
                    240, 240, 240
                );
                
                // 英文模式下显示提示
                if (!isChineseMode) {
                    const promptText = "英文直接输入";
                    const [promptW, promptH] = window.getScrText(promptText, 1);
                    window.setScrText(
                        promptText,
                        SCREEN_WIDTH - promptW - 2, imeY + (IME_AREA_HEIGHT - promptH) / 2,
                        1,
                        150, 150, 150,
                        240, 240, 240
                    );
                    const [candW, candH] = window.getScrText("英文无需候选字", 1);
                            const candX = 2;
                                window.setScrText(
                                    "英文无需候选字",
                                    candX, imeY + (IME_AREA_HEIGHT - candH) / 2 + 23,
                                    1,
                                    128, 128, 128,
                                    240, 240, 240
                                );
                } else {
                    // 中文模式下显示拼音和候选字
                    if (imeBuffer.length > 0) {
                        // 显示拼音
                        const pinyinText = imeBuffer;
                        const [pinyinW, pinyinH] = window.getScrText(pinyinText, 1);
                        window.setScrText(
                            pinyinText,
                            40, imeY + (IME_AREA_HEIGHT - pinyinH) / 2,
                            1,
                            0, 0, 150,
                            240, 240, 240
                        );
                        
                        // 显示候选字
                        const startIdx = imePage * IME_MAX_CANDIDATES;
                        let candidatesText = "";
                        for (let i = 0; i < IME_MAX_CANDIDATES; i++) {
                            const idx = startIdx + i;
                            if (idx < imeCandidates.length) {
                                candidatesText += (i+1) + "." + imeCandidates[idx] + " ";
                            }
                        }
                        
                        if (candidatesText.length > 0) {
                            const [candW, candH] = window.getScrText(candidatesText, 1);
                            const candX = 2;
                                window.setScrText(
                                    candidatesText,
                                    candX, imeY + (IME_AREA_HEIGHT - candH) / 2 + 23,
                                    1,
                                    0, 0, 0,
                                    240, 240, 240
                                );
                        }else{
                            const [candW, candH] = window.getScrText("无候选字", 1);
                            const candX = 2;
                                window.setScrText(
                                    "无候选字",
                                    candX, imeY + (IME_AREA_HEIGHT - candH) / 2 + 23,
                                    1,
                                    128, 128, 128,
                                    240, 240, 240
                                );
                                const pageText = `非法拼音`;
                            const [pageW, pageH] = window.getScrText(pageText, 1);
                            window.setScrText(
                                pageText,
                                SCREEN_WIDTH - pageW - 2, imeY+7,
                                1,
                                100, 100, 100,
                                240, 240, 240
                            );
                        }
                        
                        // 显示分页指示
                        if (imeCandidates.length > IME_MAX_CANDIDATES) {
                            const pageText = `[${imePage+1}/${Math.ceil(imeCandidates.length/IME_MAX_CANDIDATES)}]`;
                            const [pageW, pageH] = window.getScrText(pageText, 1);
                            window.setScrText(
                                pageText,
                                SCREEN_WIDTH - pageW - 2, imeY+8,
                                1,
                                100, 100, 100,
                                240, 240, 240
                            );
                        }
                    } else {
                        // 没有拼音时显示提示
                        const promptText = "输入拼音";
                        const [promptW, promptH] = window.getScrText(promptText, 1);
                        window.setScrText(
                            promptText,
                            SCREEN_WIDTH - promptW - 2, imeY + (IME_AREA_HEIGHT - promptH) / 2,
                            1,
                            0, 0, 150,
                            240, 240, 240
                        );
                        const [candW, candH] = window.getScrText("无候选字", 1);
                            const candX = 2;
                                window.setScrText(
                                    "无候选字",
                                    candX, imeY + (IME_AREA_HEIGHT - candH) / 2 + 23,
                                    1,
                                    128, 128, 128,
                                    240, 240, 240
                                );
                    }
                }

                // ---------- 统计面板（屏幕中央，1px 黑边，绿色标题）----------
                if (statsPanelOpen) {
                    const fullText = textBuffer.map(function(item) { return item.char; }).join('');
                    const utf8Bytes = new TextEncoder().encode(fullText).length;
                    const newlineCount = (fullText.match(/\n/g) || []).length;
                    const totalLines = newlineCount + 1;
                    const displayLines = lines.length;
                    const selRange = getSelectionRange();
                    const selCount = selRange ? (selRange[1] - selRange[0]) : null;
                    const sx0 = Math.floor((SCREEN_WIDTH - STATS_BOX_W) / 2);
                    const sy0 = Math.floor((SCREEN_HEIGHT - STATS_BOX_H) / 2);
                    const sx1 = sx0 + STATS_BOX_W - 1;
                    const sy1 = sy0 + STATS_BOX_H - 1;
                    window.setScr2(sx0, sy0, sx1, sy0, 0, 0, 0);
                    window.setScr2(sx0, sy1, sx1, sy1, 0, 0, 0);
                    window.setScr2(sx0, sy0, sx0, sy1, 0, 0, 0);
                    window.setScr2(sx1, sy0, sx1, sy1, 0, 0, 0);
                    window.setScr2(sx0 + 1, sy0 + 1, sx1 - 1, sy1 - 1, 255, 255, 255);
                    const titleText = '统计面板';
                    const [tw, th] = window.getScrText(titleText, 1);
                    const titleX = sx0 + Math.floor((STATS_BOX_W - tw) / 2);
                    const titleY = sy0 + 4;
                    window.setScrText(titleText, titleX, titleY, 1, 0, 180, 0, 255, 255, 255);
                    const lineY = sy0 + 4 + th + 2;
                    window.setScr2(sx0 + 1, lineY, sx1 - 1, lineY, 0, 0, 0);
                    let rowY = lineY + 4;
                    const lineH = th + 2;
                    const rBlue = 0, gBlue = 0, bBlue = 255;
                    const statsRows = [
                        { prefix: '字符数: ', value: String(textBuffer.length) },
                        { prefix: '字节数: ', value: String(utf8Bytes) },
                        { prefix: '行数: ', value: String(totalLines) },
                        { prefix: '视行数: ', value: String(displayLines) },
                        { prefix: '选区字符数: ', value: selCount !== null ? String(selCount) : '无' }
                    ];
                    for (let i = 0; i < statsRows.length; i++) {
                        const prefix = statsRows[i].prefix;
                        const value = statsRows[i].value;
                        const isNum = statsRows[i].value !== '无';
                        window.setScrText(prefix, sx0 + 8, rowY, 1, 0, 0, 0, 255, 255, 255);
                        const [pw] = window.getScrText(prefix, 1);
                        const valueR = isNum ? rBlue : 0, valueG = isNum ? gBlue : 0, valueB = isNum ? bBlue : 0;
                        window.setScrText(value, sx0 + 8 + pw, rowY, 1, valueR, valueG, valueB, 255, 255, 255);
                        rowY += lineH;
                    }
                }

                // ---------- 光标信息面板（红标题，样式同统计；跳转类型由左右键切换）----------
                if (cursorPanelOpen) {
                    const newlineIndices = [];
                    for (let i = 0; i < textBuffer.length; i++) {
                        if (textBuffer[i].char === '\n') newlineIndices.push(i);
                    }
                    let cursorLogicalLine = 1;
                    for (let i = 0; i < newlineIndices.length; i++) {
                        if (cursorPosition <= newlineIndices[i]) break;
                        cursorLogicalLine = i + 2;
                    }
                    const lineStart = cursorLogicalLine === 1 ? 0 : newlineIndices[cursorLogicalLine - 2] + 1;
                    const cursorLogicalCol = cursorPosition - lineStart + 1;
                    const cursorPos1Based = cursorPosition + 1;
                    const visualInfo = getCursorVisualLineAndCol();
                    const displayRow = cursorPanelLineMode === 'logical' ? cursorLogicalLine : visualInfo.visualLine1;
                    const displayCol = cursorPanelLineMode === 'logical' ? cursorLogicalCol : visualInfo.visualCol1;
                    const cx0 = Math.floor((SCREEN_WIDTH - CURSOR_BOX_W) / 2);
                    const cy0 = Math.floor((SCREEN_HEIGHT - CURSOR_BOX_H) / 2);
                    const cx1 = cx0 + CURSOR_BOX_W - 1;
                    const cy1 = cy0 + CURSOR_BOX_H - 1;
                    window.setScr2(cx0, cy0, cx1, cy0, 0, 0, 0);
                    window.setScr2(cx0, cy1, cx1, cy1, 0, 0, 0);
                    window.setScr2(cx0, cy0, cx0, cy1, 0, 0, 0);
                    window.setScr2(cx1, cy0, cx1, cy1, 0, 0, 0);
                    window.setScr2(cx0 + 1, cy0 + 1, cx1 - 1, cy1 - 1, 255, 255, 255);
                    const cTitleText = cursorPanelLineMode === 'logical' ? '光标信息: 逻辑行' : '光标信息: 视行';
                    const [ctw, cth] = window.getScrText(cTitleText, 1);
                    const cTitleX = cx0 + Math.floor((CURSOR_BOX_W - ctw) / 2);
                    const cTitleY = cy0 + 4;
                    window.setScrText(cTitleText, cTitleX, cTitleY, 1, 255, 0, 0, 255, 255, 255);
                    const cLineY = cy0 + 4 + cth + 2;
                    window.setScr2(cx0 + 1, cLineY, cx1 - 1, cLineY, 0, 0, 0);
                    let cRowY = cLineY + 4;
                    const cLineH = cth + 2;
                    const cRBlue = 0, cGBlue = 0, cBBlue = 255;
                    const cursorRows = [
                        { prefix: '行数: ', value: String(displayRow) },
                        { prefix: '列数: ', value: String(displayCol) },
                        { prefix: '位置: ', value: String(cursorPos1Based) }
                    ];
                    for (let i = 0; i < cursorRows.length; i++) {
                        const prefix = cursorRows[i].prefix;
                        const value = cursorRows[i].value;
                        window.setScrText(prefix, cx0 + 8, cRowY, 1, 0, 0, 0, 255, 255, 255);
                        const [pw] = window.getScrText(prefix, 1);
                        window.setScrText(value, cx0 + 8 + pw, cRowY, 1, cRBlue, cGBlue, cBBlue, 255, 255, 255);
                        cRowY += cLineH;
                    }
                    const gotoLineY = cRowY + 2;
                    window.setScr2(cx0 + 1, cRowY, cx1 - 1, cRowY, 0, 0, 0);
                    const gotoPrefix = cursorPanelPrefix;
                    const prefixIsError = Object.values(GOTO_TYPE_ERRORS).indexOf(gotoPrefix) >= 0;
                    const prefixR = prefixIsError ? 255 : 0, prefixG = 0, prefixB = 0;
                    window.setScrText(gotoPrefix, cx0 + 8, gotoLineY, 1, prefixR, prefixG, prefixB, 255, 255, 255);
                    const [gpw] = window.getScrText(gotoPrefix, 1);
                    if (cursorPanelGotoBuffer.length > 0) {
                        window.setScrText(cursorPanelGotoBuffer, cx0 + 8 + gpw, gotoLineY, 1, 0, 0, 255, 255, 255, 255);
                    }
                }

                // ---------- Unicode 输入器面板（屏幕中央 180×60，1px 黑边）----------
                if (unicodeInputOpen) {
                    const ux0 = Math.floor((SCREEN_WIDTH - UNICODE_BOX_W) / 2);
                    const uy0 = Math.floor((SCREEN_HEIGHT - UNICODE_BOX_H) / 2);
                    const ux1 = ux0 + UNICODE_BOX_W - 1;
                    const uy1 = uy0 + UNICODE_BOX_H - 1;
                    // 黑边
                    window.setScr2(ux0, uy0, ux1, uy0, 0, 0, 0);
                    window.setScr2(ux0, uy1, ux1, uy1, 0, 0, 0);
                    window.setScr2(ux0, uy0, ux0, uy1, 0, 0, 0);
                    window.setScr2(ux1, uy0, ux1, uy1, 0, 0, 0);
                    // 内白
                    window.setScr2(ux0 + 1, uy0 + 1, ux1 - 1, uy1 - 1, 255, 255, 255);
                    // 橙色标题「插入unicode字符」
                    const titleText = '插入unicode字符';
                    const [tw, th] = window.getScrText(titleText, 1);
                    const titleX = ux0 + Math.floor((UNICODE_BOX_W - tw) / 2);
                    const titleY = uy0 + 4;
                    window.setScrText(titleText, titleX, titleY, 1, 255, 165, 0, 255, 255, 255);
                    // 横线（约在标题下）
                    const lineY = uy0 + 4 + th + 2;
                    window.setScr2(ux0 + 1, lineY, ux1 - 1, lineY, 0, 0, 0);
                    // 已输入字符（最多 6 个，显示大写）
                    const hexDisplay = unicodeBuffer.toUpperCase();
                    if (hexDisplay.length > 0) {
                        const [hw, hh] = window.getScrText(hexDisplay, 1);
                        const hexX = ux0 + Math.floor((UNICODE_BOX_W - hw) / 2);
                        const hexY = lineY + 4;
                        window.setScrText(hexDisplay, hexX, hexY, 1, 0, 0, 0, 255, 255, 255);
                    }
                }

                // ---------- 查找提示（屏幕中心绿底白字）----------
                if (findMessage !== null) {
                    const [tw, th] = window.getScrText(findMessage, 1);
                    const pad = 4;
                    const boxW = tw + pad * 2;
                    const boxH = th + pad * 2;
                    const fx0 = Math.max(0, Math.floor((SCREEN_WIDTH - boxW) / 2));
                    const fy0 = Math.max(0, Math.floor((SCREEN_HEIGHT - boxH) / 2));
                    const fx1 = Math.min(SCREEN_WIDTH - 1, fx0 + boxW - 1);
                    const fy1 = Math.min(SCREEN_HEIGHT - 1, fy0 + boxH - 1);
                    window.setScr2(fx0, fy0, fx1, fy1, 0, 255, 0);
                    window.setScrText(findMessage, fx0 + pad, fy0 + pad, 1, 255, 255, 255, 0, 255, 0);
                }

                // 双缓冲确认：将 B 缓冲与 A 的差异写回真实 DOM，并用 B 覆盖 A
                window.confirmScr();
            }

            function startCursorBlink() {
                if (cursorBlinkInterval) clearInterval(cursorBlinkInterval);
                cursorBlinkInterval = setInterval(() => {
                    cursorVisible = !cursorVisible;
                    render();
                }, 500);
            }

            // 键盘监听
            function handleKeyDown(e) {
                const key = e.key;

                // ---------- 光标信息面板打开时完全截获键盘 ----------
                if (cursorPanelOpen) {
                    e.preventDefault();
                    if (key === 'Escape') {
                        cursorPanelOpen = false;
                        render();
                        return;
                    }
                    if (e.ctrlKey && key === '.') {
                        cursorPanelOpen = false;
                        render();
                        return;
                    }
                    if (key === 'ArrowUp' || key === 'ArrowDown') {
                        cursorPanelLineMode = cursorPanelLineMode === 'logical' ? 'visual' : 'logical';
                        render();
                        return;
                    }
                    if (key === 'ArrowLeft' || key === 'ArrowRight') {
                        const types = ['line', 'column', 'position'];
                        let idx = types.indexOf(cursorPanelGotoType);
                        idx = key === 'ArrowRight' ? (idx + 1) % 3 : (idx + 2) % 3;
                        cursorPanelGotoType = types[idx];
                        cursorPanelGotoBuffer = '';
                        cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                        render();
                        return;
                    }
                    if (key === 'Backspace') {
                        if (cursorPanelGotoBuffer.length === 0) {
                            cursorPanelOpen = false;
                            render();
                            return;
                        }
                        cursorPanelGotoBuffer = cursorPanelGotoBuffer.slice(0, -1);
                        render();
                        return;
                    }
                    if (key === 'Enter') {
                        if (cursorPanelGotoBuffer.length > 0) {
                            const N = parseInt(cursorPanelGotoBuffer, 10);
                            if (cursorPanelGotoType === 'line') {
                                if (cursorPanelLineMode === 'logical') {
                                    const newlineIndices = [];
                                    for (let i = 0; i < textBuffer.length; i++) {
                                        if (textBuffer[i].char === '\n') newlineIndices.push(i);
                                    }
                                    const totalLogicalLines = newlineIndices.length + 1;
                                    if (!isNaN(N) && N >= 1 && N <= totalLogicalLines) {
                                        cursorPosition = N === 1 ? 0 : newlineIndices[N - 2] + 1;
                                        cursorPanelGotoBuffer = '';
                                        cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                                        ensureCursorVisible();
                                    } else {
                                        cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                    }
                                } else {
                                    if (!isNaN(N) && N >= 1 && N <= lines.length) {
                                        cursorPosition = lines[N - 1].startIndex;
                                        cursorPanelGotoBuffer = '';
                                        cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                                        ensureCursorVisible();
                                    } else {
                                        cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                    }
                                }
                            } else if (cursorPanelGotoType === 'column') {
                                if (cursorPanelLineMode === 'logical') {
                                    const newlineIndices = [];
                                    for (let i = 0; i < textBuffer.length; i++) {
                                        if (textBuffer[i].char === '\n') newlineIndices.push(i);
                                    }
                                    let lineStart = 0;
                                    for (let i = 0; i < newlineIndices.length; i++) {
                                        if (cursorPosition <= newlineIndices[i]) break;
                                        lineStart = newlineIndices[i] + 1;
                                    }
                                    let lineEnd = textBuffer.length;
                                    for (let i = 0; i < newlineIndices.length; i++) {
                                        if (newlineIndices[i] >= lineStart) {
                                            lineEnd = newlineIndices[i];
                                            break;
                                        }
                                    }
                                    const maxCol = lineEnd - lineStart + 1;
                                    if (!isNaN(N) && N >= 1 && N <= maxCol) {
                                        cursorPosition = lineStart + N - 1;
                                        cursorPanelGotoBuffer = '';
                                        cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                                        ensureCursorVisible();
                                    } else {
                                        cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                    }
                                } else {
                                    const loc = getCursorLocation();
                                    const line = lines[loc.lineIndex];
                                    if (!line) {
                                        cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                    } else {
                                        // 折行时，只有当前视行是该逻辑行的最后一段才允许跳到“行尾”列（endIndex 位置），否则会显示到下一行开头
                                        const isLastVisualOfLogical = (loc.lineIndex + 1 >= lines.length) ||
                                            (textBuffer[line.endIndex] && textBuffer[line.endIndex].char === '\n');
                                        const maxCol = isLastVisualOfLogical
                                            ? line.endIndex - line.startIndex + 1
                                            : line.endIndex - line.startIndex;
                                        if (!isNaN(N) && N >= 1 && N <= maxCol) {
                                            cursorPosition = line.startIndex + N - 1;
                                            cursorPanelGotoBuffer = '';
                                            cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                                            ensureCursorVisible();
                                        } else {
                                            cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                        }
                                    }
                                }
                            } else {
                                const pos = N;
                                if (!isNaN(pos) && pos >= 1 && pos <= textBuffer.length + 1) {
                                    cursorPosition = pos - 1;
                                    cursorPanelGotoBuffer = '';
                                    cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                                    ensureCursorVisible();
                                } else {
                                    cursorPanelPrefix = GOTO_TYPE_ERRORS[cursorPanelGotoType];
                                }
                            }
                        }
                        render();
                        return;
                    }
                    if (key.length === 1 && /[0-9]/.test(key) && cursorPanelGotoBuffer.length < 10) {
                        cursorPanelGotoBuffer += key;
                        render();
                        return;
                    }
                    return;
                }

                // ---------- 统计面板打开时完全截获键盘 ----------
                if (statsPanelOpen) {
                    e.preventDefault();
                    if (key === 'Escape' || key === 'Backspace') {
                        statsPanelOpen = false;
                        render();
                        return;
                    }
                    if (e.ctrlKey && key === ',') {
                        statsPanelOpen = false;
                        render();
                        return;
                    }
                    return;
                }

                // ---------- Unicode 输入器打开时完全截获键盘 ----------
                if (unicodeInputOpen) {
                    e.preventDefault();
                    if (e.ctrlKey && key === '-') {
                        unicodeInputOpen = false;
                        unicodeBuffer = '';
                        render();
                        return;
                    }
                    if (key === 'Escape') {
                        unicodeInputOpen = false;
                        unicodeBuffer = '';
                        render();
                        return;
                    }
                    if (key === 'Enter') {
                        if (unicodeBuffer.length > 0) {
                            const code = parseInt(unicodeBuffer, 16);
                            if (!isNaN(code) && code >= 0 && code <= 0x10FFFF) {
                                const ch = String.fromCodePoint(code);
                                insertTextReplacingSelection(ch);
                            }
                        }
                        unicodeBuffer = '';
                        render();
                        return;
                    }
                    if (key === 'Backspace') {
                        if (unicodeBuffer.length === 0) {
                            unicodeInputOpen = false;
                            render();
                            return;
                        }
                        unicodeBuffer = unicodeBuffer.slice(0, -1);
                        render();
                        return;
                    }
                    const hexChar = key.length === 1 && /[0-9A-Fa-f]/.test(key);
                    if (hexChar && unicodeBuffer.length < 6) {
                        unicodeBuffer += key;
                        render();
                        return;
                    }
                    return;
                }

                // Ctrl+; 导入文件（UTF-8）
                if (e.ctrlKey && key === ';') {
                    e.preventDefault();
                    const input = document.createElement('input');
                    input.type = 'file';
                    input.accept = '*/*';
                    input.onchange = function() {
                        const file = input.files && input.files[0];
                        if (!file) return;
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            const content = ev.target && ev.target.result;
                            if (typeof content !== 'string') return;
                            textBuffer = [];
                            for (const ch of content) {
                                const w = ch === '\n' ? 0 : getCharWidth(ch);
                                textBuffer.push({ char: ch, widthPx: w });
                            }
                            cursorPosition = 0;
                            selectionAnchor = null;
                            rebuildLayout();
                            ensureCursorVisible();
                            render();
                        };
                        reader.readAsText(file, 'UTF-8');
                    };
                    input.click();
                    return;
                }

                // Ctrl+' 导出为 text.txt（UTF-8）
                if (e.ctrlKey && key === "'") {
                    e.preventDefault();
                    const fullText = textBuffer.map(function(item) { return item.char; }).join('');
                    const blob = new Blob([fullText], { type: 'text/plain;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = 'text.txt';
                    a.click();
                    URL.revokeObjectURL(a.href);
                    return;
                }

                // Ctrl+Shift+] 应用内剪贴板同步到系统（Blob 保留 \n）
                if (e.ctrlKey && e.shiftKey && (key === ']' || key === '}')) {
                    e.preventDefault();
                    const blob = new Blob([appClipboard], { type: 'text/plain;charset=utf-8' });
                    navigator.clipboard.write([new ClipboardItem({ 'text/plain': blob })]).then(function() {
                        showToast('同步到系统', 500);
                    }).catch(function() {
                        showToast('同步失败', 1000);
                    });
                    return;
                }

                // Ctrl+Shift+[ 从系统剪贴板同步到应用内
                if (e.ctrlKey && e.shiftKey && (key === '[' || key === '{')) {
                    e.preventDefault();
                    navigator.clipboard.readText().then(function(t) {
                        appClipboard = t != null ? String(t) : '';
                        showToast('从系统同步', 500);
                    }).catch(function() {
                        showToast('同步失败', 1000);
                    });
                    return;
                }

                // Ctrl+] 复制选区到应用内剪贴板（不改变选区），显示「复制」0.3s；无选区时写空
                if (e.ctrlKey && (key === ']' || key === '}')) {
                    e.preventDefault();
                    const range = getSelectionRange();
                    if (range) {
                        const [start, end] = range;
                        appClipboard = textBuffer.slice(start, end).map(function(item) { return item.char; }).join('');
                    } else {
                        appClipboard = '';
                    }
                    showToast('复制', 300);
                    return;
                }

                // Ctrl+[ 从应用内剪贴板粘贴，显示「粘贴」0.3s；剪贴板为空时粘贴空字符串
                if (e.ctrlKey && (key === '[' || key === '{')) {
                    e.preventDefault();
                    insertTextReplacingSelection(appClipboard != null ? appClipboard : '');
                    showToast('粘贴', 300);
                    return;
                }

                // Ctrl+\ 全选：选区一端在末尾，光标在开头，确保光标可见
                if (e.ctrlKey && key === '\\') {
                    e.preventDefault();
                    selectionAnchor = textBuffer.length;
                    cursorPosition = 0;
                    ensureCursorVisible();
                    cursorVisible = true;
                    render();
                    return;
                }

                // Ctrl+Shift+Left / Ctrl+Shift+Right 贪婪查找（从选区左端+1 或 右端-1 处开始）
                if (e.ctrlKey && e.shiftKey && (key === 'ArrowLeft' || key === 'ArrowRight')) {
                    e.preventDefault();
                    doFindGreedy(key === 'ArrowRight');
                    return;
                }
                // Ctrl+Left 向左查找，Ctrl+Right 向右查找（从剪贴板读 needle）
                if (e.ctrlKey && (key === 'ArrowLeft' || key === 'ArrowRight')) {
                    e.preventDefault();
                    doFind(key === 'ArrowRight');
                    return;
                }
                // Ctrl+/ 计数剪贴板内容（全文，非贪婪）；Ctrl+Shift+/ 或 Ctrl+Shift+? 贪婪计数
                if (e.ctrlKey && key === '/' && !e.shiftKey) {
                    e.preventDefault();
                    doCount(false);
                    return;
                }
                if (e.ctrlKey && e.shiftKey && (key === '/' || key === '?')) {
                    e.preventDefault();
                    doCount(true);
                    return;
                }

                // Ctrl+, 打开/关闭统计面板
                if (e.ctrlKey && key === ',') {
                    e.preventDefault();
                    statsPanelOpen = !statsPanelOpen;
                    render();
                    return;
                }

                // Ctrl+. 打开/关闭光标信息面板（打开时重置跳转前缀与类型）
                if (e.ctrlKey && key === '.') {
                    e.preventDefault();
                    cursorPanelOpen = !cursorPanelOpen;
                    if (cursorPanelOpen) {
                        cursorPanelGotoType = 'line';
                        cursorPanelPrefix = GOTO_TYPE_PREFIXES[cursorPanelGotoType];
                        cursorPanelGotoBuffer = '';
                    }
                    render();
                    return;
                }

                // Ctrl+- 打开/关闭 Unicode 输入器（有选区时不取消选区）
                if (e.ctrlKey && key === '-') {
                    e.preventDefault();
                    unicodeInputOpen = !unicodeInputOpen;
                    if (!unicodeInputOpen) unicodeBuffer = '';
                    render();
                    return;
                }
                
                // Ctrl键切换中英文模式
                if (key === 'Control') {
                    return;
                }
                if (key === 'Ctrl') {
                    return;
                }

                // 处理Ctrl键组合（切换中英文等）
                if (e.ctrlKey) {
                    if (key === '=') {
                        e.preventDefault();
                        isChineseMode = !isChineseMode;
                        if (!isChineseMode) {
                            imeBuffer = "";
                            imeCandidates = [];
                            imeSelectedIndex = 0;
                            imePage = 0;
                        }
                        cursorVisible = true;
                        render();
                        return;
                    }
                    return;
                }

                // ---------- 选区与方向键 ----------
                const hasSelection = getSelectionRange() !== null;
                const shiftHeld = e.shiftKey;
                const allowSelect = canSelect();

                if (key === 'ArrowUp' || key === 'ArrowDown' || key === 'ArrowLeft' || key === 'ArrowRight' ||
                    key === 'Home' || key === 'End' || key === 'PageUp' || key === 'PageDown') {
                    e.preventDefault();
                    if (shiftHeld && allowSelect) {
                        if (selectionAnchor === null) selectionAnchor = cursorPosition;
                        if (key === 'ArrowUp') moveCursorUp();
                        else if (key === 'ArrowDown') moveCursorDown();
                        else if (key === 'ArrowLeft' && cursorPosition > 0) {
                            cursorPosition--;
                            if (isChineseMode) { imeBuffer = ''; imeCandidates = []; }
                            lastCursorX = getCursorLocation().x;
                            ensureCursorVisible();
                            cursorVisible = true;
                            render();
                        } else if (key === 'ArrowRight' && cursorPosition < textBuffer.length) {
                            cursorPosition++;
                            if (isChineseMode) { imeBuffer = ''; imeCandidates = []; }
                            lastCursorX = getCursorLocation().x;
                            ensureCursorVisible();
                            cursorVisible = true;
                            render();
                        } else if (key === 'Home') moveCursorToLineStart();
                        else if (key === 'End') moveCursorToLineEnd();
                        else if (key === 'PageUp') moveCursorPageUp();
                        else if (key === 'PageDown') moveCursorPageDown();
                        return;
                    }
                    if (!shiftHeld && hasSelection) {
                        selectionAnchor = null;
                    }
                }

                // 方向键 / Home / End / PageUp / PageDown（无 shift 或已清空选区后照常移动）
                if (key === 'ArrowUp') {
                    e.preventDefault();
                    moveCursorUp();
                } else if (key === 'ArrowDown') {
                    e.preventDefault();
                    moveCursorDown();
                } else if (key === 'Home') {
                    e.preventDefault();
                    moveCursorToLineStart();
                } else if (key === 'End') {
                    e.preventDefault();
                    moveCursorToLineEnd();
                } else if (key === 'PageUp') {
                    e.preventDefault();
                    moveCursorPageUp();
                } else if (key === 'PageDown') {
                    e.preventDefault();
                    moveCursorPageDown();
                } else if (key === 'ArrowLeft') {
                    e.preventDefault();
                    if (cursorPosition > 0) {
                        cursorPosition--;
                        if (isChineseMode) { imeBuffer = ""; imeCandidates = []; }
                        lastCursorX = getCursorLocation().x;
                    }
                    ensureCursorVisible();
                    cursorVisible = true;
                    render();
                } else if (key === 'ArrowRight') {
                    e.preventDefault();
                    if (cursorPosition < textBuffer.length) {
                        cursorPosition++;
                        if (isChineseMode) { imeBuffer = ""; imeCandidates = []; }
                        lastCursorX = getCursorLocation().x;
                    }
                    ensureCursorVisible();
                    cursorVisible = true;
                    render();
                } else if (key === 'Insert') {
                    e.preventDefault();
                    overwriteMode = !overwriteMode;
                    cursorVisible = true;
                    render();
                } else if (key === 'Delete') {
                    e.preventDefault();
                    const range = getSelectionRange();
                    if (range !== null && (!isChineseMode || imeBuffer.length === 0)) {
                        const [start, end] = range;
                        textBuffer.splice(start, end - start);
                        cursorPosition = start;
                        selectionAnchor = null;
                    } else if (cursorPosition < textBuffer.length) {
                        textBuffer.splice(cursorPosition, 1);
                    }
                    if (range !== null || cursorPosition < textBuffer.length) {
                        rebuildLayout();
                        ensureCursorVisible();
                        cursorVisible = true;
                        render();
                    }
                } else if (key === 'Backspace') {
                    e.preventDefault();
                    const range = getSelectionRange();
                    // 有选区且（英文或中文 buffer 为空）时才删除选区；中文有 buffer 时交给 IME 处理
                    const shouldDeleteSelection = range !== null && (!isChineseMode || imeBuffer.length === 0);
                    if (shouldDeleteSelection) {
                        const [start, end] = range;
                        textBuffer.splice(start, end - start);
                        cursorPosition = start;
                        selectionAnchor = null;
                        rebuildLayout();
                        ensureCursorVisible();
                        cursorVisible = true;
                        render();
                    } else {
                        insertChar('Backspace');
                    }
                } else if (key === 'Enter') {
                    e.preventDefault();
                    insertChar('Enter');
                }else if (key.length === 1 && !e.ctrlKey && !e.metaKey) {
                    e.preventDefault();
                    insertChar(key);
                }
            }

            // 初始化
            async function init() {
                try {
                    window.createScr(SCREEN_WIDTH, SCREEN_HEIGHT);
                    screenCreated = true;

                    await window.loadScrfont('unifont.otf');
                    fontLoaded = true;
                    console.log('字体加载成功');

                    measureFontMetrics();

                    textBuffer = [];
                    cursorPosition = 0;
                    lastCursorX = 0;
                    
                    const testText = "Hello World!\n钱辰飞你好。\nBy Altzin. 点击弹出键盘。\nCXT *****\nText editer V6.\n文本编辑器第六版\n-----使用说明-----\n按方向键来移动\nCtrl+= 切换输入法\nCtrl+_ 码点输入\nCtrl+] 复制 Ctrl+[ 粘贴\nCtrl+Shift+]\n同步剪贴板到系统\nCtrl+Shift+[\n从系统同步剪贴板\nCtrl+; 打开 Ctrl+' 保存\nCtrl+左右 查找剪贴板\nCtrl+Shift+左右 贪婪查找\nCtrl+/ 计数全文\nCtrl+Shift+/ 贪婪计数\nCtrl+, 统计面板\nCtrl+. 光标面板\nCtrl+- 码点输入器\nShift+方向 选择\nCtrl+\\ 全选\nCtrl+< 统计面板\nCtrl+> 光标面板\n光标面板方向数字操作，码点输入数字字母，中文输入法输入拼音，数字选字，-=翻页";
                    for (let char of testText) {
                        const w = getCharWidth(char);
                        textBuffer.push({ char, widthPx: w });
                    }
                    cursorPosition = 0;
                    
                    rebuildLayout();
                    
                    startCursorBlink();
                    
                    ensureCursorVisible();
                    render();

                    window.addEventListener('keydown', handleKeyDown);

                    if (typeof window.initSoftKeyboard === 'function') {
                        window.initSoftKeyboard();
                    }

                    console.log('初始化完成，行高:', LINE_HEIGHT, '总行数:', lines.length);
                } catch (error) {
                    console.error('初始化失败:', error);
                    if (screenCreated) {
                        window.setScr2(0, 0, SCREEN_WIDTH-1, 20, 255,0,0);
                    }
                }
            }

            init();

            window.cleanupKeyboard = function() {
                if (cursorBlinkInterval) {
                    clearInterval(cursorBlinkInterval);
                }
                window.removeEventListener('keydown', handleKeyDown);
                window.cleanupScrText?.();
            };
        })();
    </script>
</body>
</html>
